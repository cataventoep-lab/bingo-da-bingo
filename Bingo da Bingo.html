<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo da Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bfe3f7; --sky2:#e6f5fd; --grass:#9fd36b; --ink:#23305a; --paper:#ffffff;
  --blue:#5aa9e6; --blue-dk:#2f6fb0; --blue-lt:#d4eafa;
  --orange:#f39a4a; --orange-dk:#c4621f; --orange-lt:#fde6cf;
  --cream:#fff8dc; --muted:#5b6788; --shadow:rgba(35,48,90,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky:#16264a; --sky2:#0f1b36; --grass:#3d6b2c; --ink:#eef3ff; --paper:#1d2b52;
    --blue-lt:#24426e; --orange-lt:#5a3a22; --cream:#3a3220; --muted:#a9b6d8; --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky:#16264a; --sky2:#0f1b36; --grass:#3d6b2c; --ink:#eef3ff; --paper:#1d2b52;
  --blue-lt:#24426e; --orange-lt:#5a3a22; --cream:#3a3220; --muted:#a9b6d8; --shadow:rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  font-family:"Fredoka","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%,var(--grass) 70%,var(--grass) 100%) fixed;
  background-color:var(--sky);
}
button{font-family:inherit}
:focus-visible{outline:4px solid var(--orange-dk);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1.logo{
  text-align:center;margin:8px 0 4px;font-weight:700;letter-spacing:.02em;
  font-size:clamp(2.2rem,6vw,4rem);line-height:1;
  color:var(--orange);
  text-shadow:3px 3px 0 var(--blue-dk),6px 6px 0 rgba(0,0,0,.12);
}
.logo span{color:var(--blue)}
.sub{text-align:center;margin:0 0 18px;color:var(--muted);font-size:1.05rem}

/* setup */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:820px;margin:0 auto}
.pcard{background:var(--paper);border-radius:28px;padding:20px;box-shadow:0 8px 0 var(--shadow);border:4px solid var(--ink)}
.pcard h2{margin:0 0 12px;font-size:1.4rem}
.pcard label{display:block;font-weight:500;margin-bottom:6px}
.pcard input{width:100%;font:inherit;font-size:1.15rem;padding:10px 14px;border-radius:16px;border:3px solid var(--muted);background:var(--sky2);color:var(--ink)}
.pick{display:flex;gap:12px;margin-top:14px}
.pick button{flex:1;border:4px solid transparent;border-radius:20px;padding:10px 6px 8px;cursor:pointer;background:var(--sky2);color:var(--ink);font-size:1.1rem;font-weight:600}
.pick button img{display:block;height:110px;margin:0 auto 4px;pointer-events:none}
.pick button[data-c="bluey"][aria-pressed="true"]{border-color:var(--blue);background:var(--blue-lt)}
.pick button[data-c="bingo"][aria-pressed="true"]{border-color:var(--orange);background:var(--orange-lt)}
.start{display:block;margin:22px auto 0;font-size:1.5rem;font-weight:700;padding:14px 40px;border-radius:999px;border:4px solid var(--ink);background:var(--orange);color:#fff;cursor:pointer;box-shadow:0 6px 0 var(--ink)}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.start:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;color:var(--muted);min-height:1.4em;margin-top:10px}

/* game */
.game{display:none;grid-template-columns:1fr minmax(220px,280px) 1fr;gap:18px;align-items:start}
.board{background:var(--paper);border-radius:28px;padding:14px 14px 16px;border:4px solid var(--ink);box-shadow:0 8px 0 var(--shadow);position:relative}
.board.bluey{--c:var(--blue);--cdk:var(--blue-dk);--clt:var(--blue-lt)}
.board.bingo{--c:var(--orange);--cdk:var(--orange-dk);--clt:var(--orange-lt)}
.who{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.who img{height:96px}
.who .nm{font-size:1.5rem;font-weight:700;line-height:1.1;color:var(--cdk)}
.who .ct{color:var(--muted);font-size:1rem}
.bar{height:10px;border-radius:99px;background:var(--clt);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{
  aspect-ratio:1/1;border-radius:16px;border:3px solid var(--cdk);background:var(--clt);color:var(--ink);
  font-size:clamp(1.2rem,2.6vw,2rem);font-weight:700;cursor:pointer;position:relative;
  transition:transform .15s, background .25s;
}
.cell.ready{animation:pulse 1s infinite;background:var(--cream);border-color:#e0a400}
.cell.marked{background:var(--c);color:#fff;border-color:var(--cdk);cursor:default;animation:none}
.cell.marked::after{content:"★";position:absolute;top:2px;right:6px;font-size:.6em;opacity:.85}
.cell.nope{animation:shake .35s}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.machine{background:var(--paper);border-radius:28px;padding:16px;border:4px solid var(--ink);box-shadow:0 8px 0 var(--shadow);text-align:center;position:sticky;top:12px}
.globe{width:180px;height:180px;margin:4px auto 12px;border-radius:50%;border:6px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--sky2) 13% 100%);position:relative;overflow:hidden}
.globe.spin .balls{animation:roll .5s linear infinite}
.balls{position:absolute;inset:0}
.balls b{position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink)}
@keyframes roll{to{transform:rotate(360deg)}}
.ball{
  width:120px;height:120px;margin:-70px auto 8px;border-radius:50%;position:relative;z-index:2;
  background:#fff;border:6px solid var(--orange);display:grid;place-items:center;
  font-size:2.8rem;font-weight:700;color:#23305a;box-shadow:0 6px 0 var(--shadow);
}
.ball.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.spinbtn{width:100%;font-size:1.4rem;font-weight:700;padding:12px;border-radius:999px;border:4px solid var(--ink);background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.spinbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.spinbtn:disabled{opacity:.5;cursor:not-allowed}
.msg{min-height:2.8em;margin:10px 0 6px;font-size:1.05rem;color:var(--muted)}
.hist{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-height:150px;overflow:auto}
.hist span{font-size:.9rem;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff}
.hist .h-neutral{background:var(--muted)}
.small{font-size:.9rem;color:var(--muted);margin-top:8px}
.ghost{margin-top:10px;background:none;border:3px solid var(--muted);color:var(--ink);border-radius:999px;padding:6px 16px;font-size:1rem;cursor:pointer}

/* win */
.win{position:fixed;inset:0;background:rgba(20,30,60,.65);display:none;place-items:center;z-index:50;padding:16px}
.win.show{display:grid}
.win .box{background:var(--paper);border:5px solid var(--ink);border-radius:32px;padding:24px 28px;text-align:center;max-width:420px;animation:pop .5s}
.win img{height:200px}
.win h2{font-size:2.4rem;margin:6px 0 4px;color:var(--orange)}
.win p{font-size:1.2rem;margin:0 0 16px}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:860px){
  .game{grid-template-columns:1fr 1fr}
  .machine{grid-column:1/-1;order:-1;position:static}
  .globe{width:130px;height:130px}
}
@media (max-width:560px){
  .setup,.game{grid-template-columns:1fr}
  .who img{height:72px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

const LETTERS="A B C D E F G H I J L M N O P Q R S T U V X Z".split(" ");
const SYL="BA BE BO BU CA CO DA DE DO FA FO GA GO JA LA LE LI LO LU MA ME MO MU NA NE PA PE PO RA RE RI SA SE SO TA TE TO VA VO".split(" ");
const choice={1:null,2:null};
let S=null; // state

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

document.querySelectorAll(".pick").forEach(g=>{
  g.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    const p=g.dataset.p, o=p==="1"?"2":"1", c=b.dataset.c, other=c==="bluey"?"bingo":"bluey";
    choice[p]=c; choice[o]=other;
    document.querySelectorAll(".pick").forEach(pg=>pg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===choice[pg.dataset.p])));
    check();
  });
});
["n1","n2"].forEach(id=>$(id).addEventListener("input",check));
function check(){
  const ok=$("n1").value.trim()&&$("n2").value.trim()&&choice[1];
  $("start").disabled=!ok;
  $("hint").textContent=ok?"Tudo pronto!":"Escrevam os dois nomes e escolham um personagem.";
}

function newCards(){
  const L=shuffle(LETTERS), Sy=shuffle(SYL).slice(0,17);
  // 23 letras + 17 sílabas = 40 espaços; dividir letras 12/11 aleatoriamente
  const firstGetsMore=Math.random()<.5;
  const nA=firstGetsMore?12:11;
  const a=L.slice(0,nA).concat(Sy.slice(0,20-nA));
  const b=L.slice(nA).concat(Sy.slice(20-nA));
  return {bluey:shuffle(a),bingo:shuffle(b)};
}

function startGame(){
  const names={};names[choice[1]]=$("n1").value.trim();names[choice[2]]=$("n2").value.trim();
  const cards=newCards();
  S={names,cards,marked:{bluey:new Set(),bingo:new Set()},drawn:[],pool:shuffle(cards.bluey.concat(cards.bingo)),over:false,spinning:false};
  $("setup").style.display="none";$("game").style.display="grid";
  $("sub").textContent="Sorteie, procure na sua cartela e toque para marcar!";
  ["bluey","bingo"].forEach(render);
  $("hist").innerHTML="";$("ball").textContent="?";$("msg").textContent="Aperte “Girar!” para sortear.";
  $("spin").disabled=false;updLeft();
}

function render(ch){
  const el=$("b-"+ch), nm=S.names[ch], label=ch==="bluey"?"Bluey":"Bingo";
  el.innerHTML=`<div class="who"><img src="${IMG[ch]}" alt="${label}"><div style="flex:1"><div class="nm">${esc(nm)}</div><div class="ct">${label} · <span id="cnt-${ch}">0</span> de 20</div><div class="bar"><i id="bar-${ch}"></i></div></div></div><div class="grid" role="grid"></div>`;
  const g=el.querySelector(".grid");
  S.cards[ch].forEach(v=>{
    const c=document.createElement("button");c.className="cell";c.textContent=v;c.dataset.v=v;
    c.setAttribute("aria-label",v);
    c.addEventListener("click",()=>mark(ch,c));
    g.appendChild(c);
  });
}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function mark(ch,c){
  if(S.over||c.classList.contains("marked"))return;
  const v=c.dataset.v;
  if(!S.drawn.includes(v)){
    c.classList.remove("nope");void c.offsetWidth;c.classList.add("nope");
    $("msg").textContent=`“${v}” ainda não foi sorteado!`;return;
  }
  c.classList.add("marked");
  S.marked[ch].add(v);
  const n=S.marked[ch].size;
  $("cnt-"+ch).textContent=n;$("bar-"+ch).style.width=(n*5)+"%";
  $("msg").textContent=`Boa, ${S.names[ch]}! Marcou “${v}”.`;
  if(n===20)win(ch);
}

const BCOL=["#5aa9e6","#f39a4a","#fde26b","#9fd36b","#e86f8a","#2f6fb0"];
function buildBalls(){
  const bb=$("balls");bb.innerHTML="";
  for(let i=0;i<12;i++){const b=document.createElement("b");b.style.background=BCOL[i%6];
    const a=i/12*Math.PI*2,r=28+Math.random()*30;b.style.left=`calc(50% + ${Math.cos(a)*r}% - 15px)`;b.style.top=`calc(50% + ${Math.sin(a)*r}% - 15px)`;bb.appendChild(b);}
}
buildBalls();

$("spin").addEventListener("click",()=>{
  if(S.spinning||S.over||!S.pool.length)return;
  S.spinning=true;$("spin").disabled=true;$("globe").classList.add("spin");
  $("msg").textContent="Girando…";
  const all=S.cards.bluey.concat(S.cards.bingo);let t=0;
  const iv=setInterval(()=>{$("ball").textContent=all[Math.floor(Math.random()*all.length)];},80);
  setTimeout(()=>{
    clearInterval(iv);$("globe").classList.remove("spin");
    const v=S.pool.pop();S.drawn.push(v);
    const ball=$("ball");ball.textContent=v;ball.classList.remove("pop");void ball.offsetWidth;ball.classList.add("pop");
    const owner=S.cards.bluey.includes(v)?"bluey":"bingo";
    const sp=document.createElement("span");sp.className="h-neutral";sp.textContent=v;$("hist").prepend(sp);
    $("msg").textContent=`Saiu “${v}”! Quem tem, toque na cartela.`;
    S.spinning=false;$("spin").disabled=S.over||!S.pool.length;updLeft();
  },1600);
});
function updLeft(){$("left").textContent=`Já sorteados: ${S.drawn.length} · Faltam: ${S.pool.length}`}

function win(ch){
  S.over=true;$("spin").disabled=true;
  $("winimg").src=IMG[ch];
  $("wintxt").textContent=`${S.names[ch]} completou a cartela da ${ch==="bluey"?"Bluey":"Bingo"} primeiro e venceu!`;
  setTimeout(()=>$("win").classList.add("show"),400);
  for(let i=0;i<80;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=BCOL[i%6];c.style.animationDuration=(2+Math.random()*2.5)+"s";c.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),5500);}
}

$("start").addEventListener("click",startGame);
$("again").addEventListener("click",()=>{$("win").classList.remove("show");startGame();});
$("restart").addEventListener("click",()=>{
  $("game").style.display="none";$("setup").style.display="block";
  $("sub").textContent="Escolham seus personagens e escrevam seus nomes";
});
</script>
</body>
</html>
